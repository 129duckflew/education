services:
  db:
    image: postgres:16-alpine
    container_name: edu-db
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
    # 映射到宿主 5433，避免与宿主机自带的 PostgreSQL(5432) 冲突
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education -d education"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: edu-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: education
      DB_PASSWORD: education
      JWT_SECRET: change-me-in-production-0123456789-abcdefghijklmn
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8180:8080"
    volumes:
      - filedata:/app/data/files

  frontend:
    build: ./frontend
    container_name: edu-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  filedata:
