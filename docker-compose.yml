services:
  db:
    image: postgres:16-alpine
    container_name: edu-postgres
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: edu-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: education
      DB_PASSWORD: education
      JWT_SECRET: change-me-in-production-0123456789-abcdefghijklmn
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - filedata:/app/data/files

volumes:
  pgdata:
  filedata:
