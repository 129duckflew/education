spring:
  datasource:
    url: jdbc:postgresql://db:5432/education
    username: ${DB_USER:education}
    password: ${DB_PASSWORD:education}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-in-production-0123456789}
  storage:
    local:
      root: /app/data/files
      public-base-url: /api/files
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
