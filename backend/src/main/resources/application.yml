spring:
  application:
    name: education-backend
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: education
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-value}
  storage:
    local:
      root: ${FILE_STORAGE_ROOT:./data/files}
      public-base-url: /api/files
  cors:
    allowed-origins: http://localhost:5173
