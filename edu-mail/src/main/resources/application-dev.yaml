# 端口
spring:
  # redis配置
  redis:
    # Redis数据库索引（默认为0）
    database: 1
    # Redis服务器地址
    host: 127.0.0.1
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password: CHANGE_ME
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
  datasource:
    url: jdbc:mysql://127.0.0.1/edu?useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: root
    password: CHANGE_ME
  jackson:
    date-format: java.text.SimpleDateFormat
  servlet:
    multipart:
      max-file-size: 10MB
  elasticsearch:
    rest:
      uris: http://localhost:9200
minio:
  config:
    endpoint: "http://127.0.0.1:9000"
    bucket-name: "education"
    access-key:  "CHANGE_ME"
    secret-key: "CHANGE_ME"